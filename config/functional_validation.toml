# ============================================================
# CVP ACCESS - VALIDATION FONCTIONNELLE REVERSIBLE
# CVP-905 / famille CVP-900
# ============================================================
#
# Ce fichier ne sert PAS au fonctionnement normal de CVP Access.
# Il pilote uniquement docs/cvp_validate_functional.py.
#
# Principe de chaque test :
#
#   GET valeur initiale
#       ↓
#   calcul d'une valeur test très proche
#       ↓
#   SET valeur test
#       ↓
#   GET vérification
#       ↓
#   SET valeur initiale
#       ↓
#   GET vérification restauration
#
# Le script s'arrête immédiatement si une restauration échoue.
#
# IMPORTANT :
#   - il faut arrêter cvp-access avant le test ;
#   - --execute est obligatoire pour autoriser les SET ;
#   - sans --execute, le script affiche seulement le plan.
#
# Exemple :
#
#   sudo systemctl stop cvp-access
#
#   cd ~/CVP_access
#
#   python3 docs/cvp_validate_functional.py \
#       --config config/functional_validation.toml \
#       --wave 1
#
#   # Si le plan est correct :
#
#   python3 docs/cvp_validate_functional.py \
#       --config config/functional_validation.toml \
#       --wave 1 \
#       --execute \
#       --output cvp_functional_wave1
#
#   sudo systemctl start cvp-access
#
# ============================================================

[validation]
format_version = 1

# Sécurité : ce fichier autorise une validation SET uniquement
# via le script dédié et uniquement avec l'option --execute.
require_execute_flag = true

timeout = 0.40
apply_delay = 0.15
between_tests = 0.10
verify_attempts = 4


# ============================================================
# WAVE 1 - TESTS PRUDENTS
# ============================================================
#
# Booléens 0/1 et paramètres 7-bit 0..127.
# Les modifications sont minuscules et immédiatement restaurées.
#

